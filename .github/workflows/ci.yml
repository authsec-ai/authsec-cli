name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Every OS reports, even when another fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows is a preview: the daemon, enforcement, policies, the
            # console link and the collector are Linux (and macOS) only, and
            # scanning on Windows has known gaps (README, Platforms).
            # Test the packages that hold on Windows; the full suite runs on
            # Linux and macOS.
            go test ./internal/access/... ./internal/cloud/... ./internal/collect/... ./internal/detect/... ./internal/parse/... ./internal/recognise/... ./internal/rules/...
          else
            go test ./...
          fi
      - run: go build ./cmd/authsec-cli
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
